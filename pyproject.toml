# See PEP 518 for the spec of this file
# https://www.python.org/dev/peps/pep-0518/

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-cable-patcher"
version = "0.4.2"
authors = [
    {name = "Joel Adria"},
    {name = "Moment Factory"},
]
description = "NetBox plugin providing a visual patch bay interface for managing cable connections."
readme = "README.md"
license = "Apache-2.0"

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    "Programming Language :: Python :: 3 :: Only",
    'Programming Language :: Python :: 3.13',
]

requires-python = ">=3.13.0"

[project.optional-dependencies]
test = [
    "black==24.3.0",
    "check-manifest==0.49",
    "flake8",
    "flake8-pyproject",
    "pre-commit==3.7.0",
    "pytest==8.1.1",
]

[project.urls]
Documentation = "https://joeladria.github.io/netbox-cable-patcher/"
Source = "https://github.com/joeladria/netbox-cable-patcher"
Tracker = "https://github.com/joeladria/netbox-cable-patcher/issues"

[tool.black]
line-length = 120
target_version = ['py313']

[tool.setuptools.packages.find]
include = ["netbox_cable_patcher*"]

[tool.setuptools.package-data]
netbox_cable_patcher = ["templates/**", "static/**"]
